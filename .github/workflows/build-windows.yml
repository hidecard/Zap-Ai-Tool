name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  build-windows:
    name: Build Zap Ai Tool Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build renderer and Electron main process
        run: npm run build

      - name: Package Windows NSIS installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-ai-tool-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
